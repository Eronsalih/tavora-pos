name: tavora-pos

# Production stack for the DigitalOcean droplet.
# Only Caddy publishes ports (80/443). Mongo, backend and frontend are
# reachable only inside the Docker network.
#
# Replace YOUR_GITHUB_USERNAME (lowercase!) with your GitHub username.

services:
  caddy:
    image: caddy:2
    container_name: tavora-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # ":80"          -> plain HTTP on the server IP (first deploy, no domain yet)
      # "tavora-pos.com" -> automatic HTTPS certificate
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  mongo:
    image: mongo:7
    container_name: tavora-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    image: ghcr.io/eronsalih/tavora-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: tavora-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      APP_ENV: production
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB_NAME: tavora
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ALLOW_DEMO_TOOLS: "false"
      PADDLE_ENVIRONMENT: ${PADDLE_ENVIRONMENT:-sandbox}
      PADDLE_API_KEY: ${PADDLE_API_KEY:-}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
      PADDLE_CHECKOUT_BASE_URL: ${PADDLE_CHECKOUT_BASE_URL:-}
      PADDLE_PRICE_ID_STARTER_MONTHLY: ${PADDLE_PRICE_ID_STARTER_MONTHLY:-}
      PADDLE_PRICE_ID_STARTER_YEARLY: ${PADDLE_PRICE_ID_STARTER_YEARLY:-}
      PADDLE_PRICE_ID_STANDARD_MONTHLY: ${PADDLE_PRICE_ID_STANDARD_MONTHLY:-}
      PADDLE_PRICE_ID_STANDARD_YEARLY: ${PADDLE_PRICE_ID_STANDARD_YEARLY:-}
      PADDLE_PRICE_ID_PRO_MONTHLY: ${PADDLE_PRICE_ID_PRO_MONTHLY:-}
      PADDLE_PRICE_ID_PRO_YEARLY: ${PADDLE_PRICE_ID_PRO_YEARLY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    image: ghcr.io/eronsalih/tavora-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: tavora-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
  caddy_data:
  caddy_config: