name: CI/CD Pipeline

on:
  push:
    branches:
      - main

# Never run two deploys to production at the same time.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Tests first: if they fail, nothing is built or deployed ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run backend tests
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          pytest -v

      # --- Build and push images ---
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One step: builds both services and pushes both tags (SHA + latest)
      - name: Build and push images
        env:
          IMAGE_TAG: ${{ github.sha }}
          # Compose checks ALL variables when it reads the file, even for build.
          # This value is only for reading the file: it is NOT baked into the image.
          # The real secret is written to .env on the VM in the deploy job.
          JWT_SECRET_KEY: build-only-placeholder
        run: docker compose -f docker-compose.prod.yml build --push

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create project directory on VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            mkdir -p ~/tavora-pos

      - name: Copy Docker Compose file to VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "docker-compose.prod.yml"
          target: "tavora-pos"

      - name: Pull and deploy on VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ~/tavora-pos

            # .env is written from GitHub secrets on every deploy,
            # so a brand-new VM needs no manual setup.
            # Paddle secrets that don't exist yet are simply empty.
            umask 077
            cat > .env <<ENVFILE
            IMAGE_TAG=${{ github.sha }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
            PADDLE_ENVIRONMENT=${{ secrets.PADDLE_ENVIRONMENT }}
            PADDLE_API_KEY=${{ secrets.PADDLE_API_KEY }}
            PADDLE_WEBHOOK_SECRET=${{ secrets.PADDLE_WEBHOOK_SECRET }}
            PADDLE_CHECKOUT_BASE_URL=${{ secrets.PADDLE_CHECKOUT_BASE_URL }}
            PADDLE_PRICE_ID_STARTER_MONTHLY=${{ secrets.PADDLE_PRICE_ID_STARTER_MONTHLY }}
            PADDLE_PRICE_ID_STARTER_YEARLY=${{ secrets.PADDLE_PRICE_ID_STARTER_YEARLY }}
            PADDLE_PRICE_ID_STANDARD_MONTHLY=${{ secrets.PADDLE_PRICE_ID_STANDARD_MONTHLY }}
            PADDLE_PRICE_ID_STANDARD_YEARLY=${{ secrets.PADDLE_PRICE_ID_STANDARD_YEARLY }}
            PADDLE_PRICE_ID_PRO_MONTHLY=${{ secrets.PADDLE_PRICE_ID_PRO_MONTHLY }}
            PADDLE_PRICE_ID_PRO_YEARLY=${{ secrets.PADDLE_PRICE_ID_PRO_YEARLY }}
            ENVFILE

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u "${{ github.repository_owner }}" \
              --password-stdin

            docker compose -f docker-compose.prod.yml pull

            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Remove unused images older than 7 days (keeps recent ones for rollback)
            docker image prune -af --filter "until=168h"

            docker compose -f docker-compose.prod.yml ps

            # Fail the pipeline if the app is not healthy after deploy
            sleep 20
            curl -fsS http://localhost/api/health
